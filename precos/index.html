<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Preços Base · Dicomp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilo.css">
  <script src="config.js"></script>
  <script src="regras.js"></script>
  <script src="app.js" defer></script>
</head>
<body>

  <header class="topo">
    <div class="marca">
      <span class="logo" aria-hidden="true"><svg class="icone" viewBox="0 0 24 24"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8Z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg></span>
      <span>Preços Base <small>· Dicomp</small></span>
    </div>
    <span class="dados-de" id="dados-de"></span>
    <div class="usuario" id="usuario" hidden>
      <button type="button" id="btn-usuario" aria-haspopup="true" aria-expanded="false">
        <span class="avatar" id="avatar" aria-hidden="true"></span>
        <span id="nome-usuario"></span>
        <svg class="icone p" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <div class="menu" id="menu-usuario" hidden>
        <div class="quem"><strong id="menu-nome"></strong><span id="menu-email"></span></div>
        <button type="button" id="btn-sair">
          <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
          Sair
        </button>
      </div>
    </div>
  </header>

  <div class="faixa" id="faixa-velho" role="status" hidden>
    <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
    <span id="faixa-velho-texto"></span>
  </div>

  <main>
    <!-- entrar -->
    <section class="tela-centro" id="tela-login" hidden>
      <div class="cartao-aviso">
        <div class="selo-grande"><svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8Z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg></div>
        <h1 id="login-titulo">Preços Base</h1>
        <p id="login-texto">Entre com a conta Google liberada pelo e-commerce.</p>
        <div class="botao-google" id="botao-google"></div>
      </div>
    </section>

    <!-- avisos: não autorizado, manutenção, configuração, erro -->
    <section class="tela-centro" id="tela-aviso" hidden>
      <div class="cartao-aviso">
        <div class="selo-grande alerta"><svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg></div>
        <h1 id="aviso-titulo"></h1>
        <p id="aviso-texto"></p>
        <button type="button" class="btn" id="aviso-botao" hidden></button>
      </div>
    </section>

    <!-- o portal -->
    <section class="conteudo" id="tela-portal" hidden>
      <div class="cartoes">
        <button type="button" class="cartao pendencias" id="cartao-pendentes" data-chip="pendentes" aria-pressed="false">
          <span class="num" id="num-pendentes">–</span><span class="rot">sem preço base</span>
        </button>
        <button type="button" class="cartao alertas" id="cartao-alerta" data-chip="alerta" aria-pressed="false">
          <span class="num" id="num-alerta">–</span><span class="rot">perdendo catálogo pela base</span>
        </button>
        <button type="button" class="cartao" id="cartao-todos" data-chip="todos">
          <span class="num" id="num-todos">–</span><span class="rot" id="rot-todos">seus produtos</span>
        </button>
      </div>

      <div class="barra-filtros">
        <label class="busca">
          <span class="sr">Buscar SKU ou nome</span>
          <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="search" id="busca" placeholder="Buscar SKU ou nome" autocomplete="off" spellcheck="false">
          <kbd aria-hidden="true">/</kbd>
        </label>
        <div class="chips" role="group" aria-label="Filtro">
          <button type="button" class="chip" data-chip="todos" aria-pressed="true">Todos</button>
          <button type="button" class="chip" data-chip="pendentes" aria-pressed="false">Pendentes</button>
          <button type="button" class="chip" data-chip="alerta" aria-pressed="false">Alerta</button>
          <button type="button" class="chip" data-chip="catalogo" aria-pressed="false">Catálogo</button>
        </div>
        <label id="caixa-comprador" hidden>
          <span class="sr">Comprador</span>
          <select class="filtro-comprador" id="filtro-comprador"></select>
        </label>
        <span class="contador" id="contador" aria-live="polite"></span>
      </div>

      <div class="tabela" role="table" aria-label="Preços base por SKU e loja" id="tabela">
        <div class="grade cabecalho" role="row" id="cabecalho"></div>
        <div role="rowgroup" id="linhas"></div>
        <div class="vazio-lista" id="vazio" hidden></div>
      </div>
    </section>
  </main>

  <footer class="rodape-lgpd">Suas alterações são registradas com seu e-mail para controle interno.
    <span class="links-rodape"><a href="sobre.html">Sobre</a> · <a href="privacidade.html">Privacidade</a> · <a href="termos.html">Termos de uso</a></span></footer>

  <div class="barra-alteracoes" id="barra" role="region" aria-label="Alterações não salvas" hidden>
    <span><span class="qtd" id="barra-qtd"></span> <span class="obs" id="barra-obs"></span></span>
    <button type="button" class="btn" id="btn-descartar">Descartar</button>
    <button type="button" class="btn primario" id="btn-revisar">Revisar e salvar</button>
  </div>

  <div class="popover" id="popover" role="dialog" aria-label="Anúncios do produto" hidden></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div id="raiz-modal"></div>
</body>
</html>
